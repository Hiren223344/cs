name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/release-notes/${TAG#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$notes"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
